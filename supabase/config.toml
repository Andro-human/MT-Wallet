
[functions.send-reminder-push]
enabled = true
# Cron-only function — no user context to validate. JWT verification
# at the gateway is off; the function does no work beyond fetching
# reminders due today and pushing to the corresponding subscriptions.
verify_jwt = false
import_map = "./functions/send-reminder-push/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-reminder-push/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-reminder-push/*.html" ]
